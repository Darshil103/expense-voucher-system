version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: evms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_voucher_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - evms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: evms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: expense_voucher_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change_this_secret
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: change_this_refresh_secret
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    volumes:
      - evms_uploads:/app/uploads

volumes:
  evms_pg_data:
  evms_uploads:
